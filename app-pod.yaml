apiVersion: v1
kind: Namespace
metadata:
  name: optracard-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optracard-frontend-deployment
  namespace: optracard-frontend
  labels:
    app: optracard-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: optracard-frontend
  template:
    metadata:
      labels:
        app: optracard-frontend
    spec:
      containers:
        - name: optracard-frontend-container
          image: saksitboom/optracard-frontend:latest
          imagePullPolicy: Always
          env:
            - name: BACKEND_UPSTREAM
              value: optracard-backend-service.optracard-backend.svc.cluster.local:8080
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: optracard-frontend-service
  namespace: optracard-frontend
spec:
  type: NodePort
  selector:
    app: optracard-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
