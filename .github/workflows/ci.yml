name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests (Cypress)
        run: npm run test:e2e

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optracard-dist
          path: dist
          retention-days: 7

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7

  deploy:
    name: Build, Push & Deploy Frontend
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.FRONTEND_API_BASE_URL }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/optracard-frontend:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifest and roll out frontend
        run: |
          kubectl apply -f app-pod.yaml
          kubectl set image deployment/optracard-frontend-deployment \
            optracard-frontend-container=${{ secrets.DOCKERHUB_USERNAME }}/optracard-frontend:${{ github.sha }} \
            -n optracard-frontend
          kubectl rollout status deployment/optracard-frontend-deployment -n optracard-frontend --timeout=180s

      - name: Set up Node.js for deployed E2E smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Run deployed full-stack smoke tests
        env:
          CYPRESS_BASE_URL: ${{ secrets.FRONTEND_URL }}
          CYPRESS_API_BASE_URL: ${{ secrets.BACKEND_API_URL }}
          CYPRESS_E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          CYPRESS_E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx cypress run --spec cypress/e2e/08-deployed-smoke.cy.ts --env REAL_E2E=true

      - name: Upload deployed E2E artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployed-cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7
