name: Frontend CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Run unit & integration tests with coverage baseline
        run: npm run test:coverage

      - name: Upload Vitest coverage baseline
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests (Cypress)
        run: npm run test:e2e

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optracard-dist
          path: dist
          retention-days: 7

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7

  deploy:
    name: Build, Push & Deploy Frontend
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    # Deployments need Docker Desktop and Kubernetes access, so they run only
    # on the Windows self-hosted runner. The CI job above remains GitHub-hosted.
    runs-on: [self-hosted, Windows, X64]
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'saksitboom' }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify self-hosted deployment prerequisites
        run: |
          docker version
          if ($LASTEXITCODE -ne 0) { throw 'Docker Desktop is not available to this runner service.' }
          kubectl version --client
          if ($LASTEXITCODE -ne 0) { throw 'kubectl is not available on this self-hosted runner.' }

      - name: Configure and verify Kubernetes access
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          $localKubeconfig = Join-Path $env:USERPROFILE '.kube\config'
          if (Test-Path -LiteralPath $localKubeconfig) {
            $kubeconfigPath = $localKubeconfig
            Write-Host 'Using the Kubernetes context configured on this self-hosted runner.'
          } elseif ($env:KUBECONFIG_BASE64) {
            $kubeconfigPath = Join-Path $env:RUNNER_TEMP 'optracard-kubeconfig'
            [IO.File]::WriteAllBytes($kubeconfigPath, [Convert]::FromBase64String($env:KUBECONFIG_BASE64.Trim()))
            Write-Host 'Using Kubernetes access from KUBECONFIG_BASE64.'
          } else {
            throw 'No local Kubernetes config is available and KUBECONFIG_BASE64 is not configured.'
          }
          "KUBECONFIG=$kubeconfigPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          kubectl --kubeconfig $kubeconfigPath cluster-info --request-timeout=15s
          if ($LASTEXITCODE -ne 0) {
            throw 'The configured Kubernetes API is unreachable from this runner. Update KUBECONFIG_BASE64 for this machine.'
          }

      - name: Log in to Docker Hub
        run: |
          if (-not $env:DOCKERHUB_TOKEN) { throw 'Missing GitHub Secret DOCKERHUB_TOKEN.' }
          $env:DOCKERHUB_TOKEN | docker login --username $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build and push frontend image
        run: |
          $imageTag = "$($env:DOCKERHUB_USERNAME)/optracard-frontend:${{ github.sha }}"
          $latestTag = "$($env:DOCKERHUB_USERNAME)/optracard-frontend:latest"
          docker build -t $imageTag -t $latestTag .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker push $imageTag
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker push $latestTag
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Apply manifest and roll out frontend
        run: |
          kubectl apply -f app-pod.yaml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl set image deployment/optracard-frontend-deployment "optracard-frontend-container=$($env:DOCKERHUB_USERNAME)/optracard-frontend:${{ github.sha }}" -n optracard-frontend
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl rollout status deployment/optracard-frontend-deployment -n optracard-frontend --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Set up Node.js for deployed E2E smoke tests
        if: env.FRONTEND_URL != ''
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run deployed full-stack smoke tests
        if: env.FRONTEND_URL != ''
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CYPRESS_E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          CYPRESS_E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $frontendPortForward = $null
          $backendPortForward = $null
          try {
            $frontendPortForward = Start-Process kubectl -ArgumentList @('port-forward', 'svc/optracard-frontend-service', '30080:80', '-n', 'optracard-frontend') -PassThru -NoNewWindow
            $backendPortForward = Start-Process kubectl -ArgumentList @('port-forward', 'svc/optracard-backend-service', '30081:8080', '-n', 'optracard-backend') -PassThru -NoNewWindow

            $ready = $false
            foreach ($attempt in 1..15) {
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:30080' -UseBasicParsing -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $ready) { throw 'Frontend port-forward did not become ready.' }

            npm ci --prefer-offline --no-audit
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $env:CYPRESS_BASE_URL = 'http://127.0.0.1:30080'
            $env:CYPRESS_API_BASE_URL = 'http://127.0.0.1:30081'
            npm run test:e2e:deployed -- --config video=false
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally {
            if ($frontendPortForward) { Stop-Process -Id $frontendPortForward.Id -Force -ErrorAction SilentlyContinue }
            if ($backendPortForward) { Stop-Process -Id $backendPortForward.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload deployed E2E artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployed-cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7
