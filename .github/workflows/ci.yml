name: Frontend CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Run unit & integration tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests (Cypress)
        run: npm run test:e2e

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optracard-dist
          path: dist
          retention-days: 7

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7

  deploy:
    name: Build, Push & Deploy Frontend
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'saksitboom' }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'saksitboom' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push frontend image
        shell: bash
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME || 'saksitboom' }}"
          IMAGE_TAG="$DOCKER_USER/optracard-frontend:${{ github.sha }}"
          LATEST_TAG="$DOCKER_USER/optracard-frontend:latest"
          # The production image uses the same-origin /api Nginx proxy. Do not
          # embed a localhost or externally port-forwarded backend URL here.
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            docker push "$IMAGE_TAG"
            docker push "$LATEST_TAG"
          fi

      - name: Apply manifest and roll out frontend
        shell: bash
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME || 'saksitboom' }}"
          kubectl apply -f app-pod.yaml
          kubectl set image deployment/optracard-frontend-deployment \
            optracard-frontend-container="$DOCKER_USER/optracard-frontend:${{ github.sha }}" \
            -n optracard-frontend
          kubectl rollout status deployment/optracard-frontend-deployment -n optracard-frontend --timeout=180s

      - name: Set up Node.js for deployed E2E smoke tests
        if: env.FRONTEND_URL != ''
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run deployed full-stack smoke tests
        if: env.FRONTEND_URL != ''
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CYPRESS_BASE_URL: ${{ secrets.FRONTEND_URL }}
          CYPRESS_E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          CYPRESS_E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        shell: bash
        run: |
          taskkill //F //IM kubectl.exe 2>/dev/null || true

          kubectl port-forward svc/optracard-frontend-service 30080:80 -n optracard-frontend & PF_FE_PID=$!
          kubectl port-forward svc/optracard-backend-service 30081:8080 -n optracard-backend & PF_BE_PID=$!
          
          trap "kill $PF_FE_PID $PF_BE_PID 2>/dev/null || true; taskkill //F //IM kubectl.exe 2>/dev/null || true" EXIT

          for i in {1..15}; do
            if curl -s -f -o /dev/null http://127.0.0.1:30080; then
              echo "Frontend port-forward is ready!"
              break
            fi
            sleep 2
          done

          if [ ! -d "node_modules/cypress" ]; then
            echo "Installing dependencies..."
            npm ci --prefer-offline --no-audit
          else
            echo "Using existing node_modules on self-hosted runner..."
          fi

          npx cypress run --config specPattern="cypress/e2e-deployed/**/*.cy.{js,jsx,ts,tsx}",video=false --spec "cypress/e2e-deployed/08-deployed-smoke.cy.ts" --env API_BASE_URL="${{ secrets.BACKEND_API_URL }}"

      - name: Upload deployed E2E artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployed-cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7
