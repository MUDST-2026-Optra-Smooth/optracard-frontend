name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Run unit & integration tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests (Cypress)
        run: npm run test:e2e

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optracard-dist
          path: dist
          retention-days: 7

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7

  deploy:
    name: Build, Push & Deploy Frontend
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'saksitboom' }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'saksitboom' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push frontend image
        shell: bash
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME || 'saksitboom' }}"
          IMAGE_TAG="$DOCKER_USER/optracard-frontend:${{ github.sha }}"
          LATEST_TAG="$DOCKER_USER/optracard-frontend:latest"
          docker build --build-arg VITE_API_BASE_URL="${{ secrets.FRONTEND_API_BASE_URL }}" -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            docker push "$IMAGE_TAG"
            docker push "$LATEST_TAG"
          fi

      - name: Apply manifest and roll out frontend
        shell: bash
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME || 'saksitboom' }}"
          kubectl apply -f app-pod.yaml
          kubectl set image deployment/optracard-frontend-deployment \
            optracard-frontend-container="$DOCKER_USER/optracard-frontend:${{ github.sha }}" \
            -n optracard-frontend
          kubectl rollout status deployment/optracard-frontend-deployment -n optracard-frontend --timeout=180s

      - name: Set up Node.js for deployed E2E smoke tests
        if: env.FRONTEND_URL != ''
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run deployed full-stack smoke tests
        if: env.FRONTEND_URL != ''
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CYPRESS_BASE_URL: ${{ secrets.FRONTEND_URL }}
          CYPRESS_E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          CYPRESS_E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        shell: bash
        run: |
          npm ci
          npx cypress run --spec cypress/e2e-deployed/08-deployed-smoke.cy.ts --env API_BASE_URL="${{ secrets.BACKEND_API_URL }}"

      - name: Upload deployed E2E artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployed-cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7
