server {
    listen 80;
    server_name localhost;

    # Keep browser requests same-origin and forward them to the Backend Service
    # in its own Kubernetes namespace. This avoids depending on a browser-side
    # port-forward for the API.
    location /api/ {
        proxy_pass http://optracard-backend-service.optracard-backend.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

